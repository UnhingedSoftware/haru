[package]
name = "haru"
description = "Live wallpapers on Linux and macOS: browse, install and run Wallpaper Engine Workshop wallpapers without Steam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "haru"
path = "src/main.rs"

[build-dependencies]
# Puts the icon into haru.exe, where Explorer and the taskbar look for it.
embed-resource = "3"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
haru-core = { workspace = true }
haru-ui = { workspace = true }
image = { workspace = true }

# The message box that says why haru stopped, since a release build on
# Windows has no console to print to.
[target.'cfg(windows)'.dependencies]
rfd = { workspace = true }

[lints]
workspace = true
