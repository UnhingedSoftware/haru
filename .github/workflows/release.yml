name: Release
# Produces a fully-populated DRAFT release to review and Publish. Kick off from
# Actions -> Release -> Run workflow (optionally type a version; blank = auto
# from Conventional Commits).
#
# One job on purpose. The obvious shape is prepare -> test -> build -> release,
# passing the changelog and the binary between them as artifacts — and that
# shape stops working the moment the account's Actions artifact storage is
# full. Nothing here needs to outlive the job that made it.
#
# Artifact: one standalone executable — download, chmod +x, run.
#   haru-linux-x86_64
#
# macOS artifacts are built by a second job on GitHub-hosted runners, which
# uploads straight into the draft this one creates — no CI artifact storage in
# the middle. No Windows build yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.2.0. Blank = auto-detect from Conventional Commits."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # git-cliff reads the history to work out the version and the notes.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          if [ -n "$input" ]; then
            version="$input"; case "$version" in v*) ;; *) version="v$version" ;; esac
          else
            raw="$(git cliff --bumped-version 2>/dev/null || true)"
            ver="${raw#v}"; if [ -z "$ver" ] || [ "$ver" = "0.0.0" ]; then ver="0.1.0"; fi
            version="v$ver"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Generate changelog
        run: |
          set -euo pipefail
          git cliff --unreleased --tag "${{ steps.version.outputs.version }}" --strip all -o RELEASE_NOTES.md
          # A release with no notes is a release nobody can read.
          test -s RELEASE_NOTES.md || echo "Initial release." > RELEASE_NOTES.md

      # The gate: nothing ships from a tree with failing tests.
      - run: cargo test --workspace

      - name: Set crate version
        run: |
          v="${{ steps.version.outputs.version }}"; v="${v#v}"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$v\"/" Cargo.toml

      - run: cargo build --release -p haru

      - name: Name the artifacts
        run: |
          set -euo pipefail
          cp target/release/haru haru-linux-x86_64
          chmod +x haru-linux-x86_64
          tar -czf haru-desktop-linux.tar.gz packaging
          ls -la haru-linux-x86_64 haru-desktop-linux.tar.gz

      - name: Create or update the draft
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          files="haru-linux-x86_64 haru-desktop-linux.tar.gz"
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Downloads

          | File | What it is |
          | --- | --- |
          | `haru-linux-x86_64` | the picker — `chmod +x`, run |
          | `haru-desktop-linux.tar.gz` | desktop entry and icons: `tar xf`, then `packaging/install.sh ./haru-linux-x86_64` |
          | `haru-macos-aarch64.dmg` | macOS — open it and drag haru into Applications |
          | `haru-macos-aarch64` | the same app as a bare binary, for a terminal |

          The app is signed ad-hoc rather than notarized, so the first launch
          needs right-click → Open (once). Settings can start the wallpaper at
          login, and can add the bare binary to your applications if you skip
          the disk image.

          Browsing needs nothing. Installing needs a Steam account that owns
          Wallpaper Engine, once: `tapline login --qr`. Applying and previewing
          need kirie.

          EOF
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V exists — updating in place"
            gh release edit "$V" --draft --title "$V" --notes-file RELEASE_NOTES.md
            # Cleared by name first: a run cancelled mid-upload leaves a
            # half-created asset, and the API then answers 400 for a fresh
            # upload of that name rather than replacing it.
            for f in $files; do
              gh release delete-asset "$V" "$f" --yes 2>/dev/null || true
            done
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$V" $files --clobber; then uploaded=1; break; fi
              echo "upload attempt $attempt failed; retrying in 20s"
              sleep 20
            done
            [ "$uploaded" = 1 ] || { echo "::error::could not upload assets"; exit 1; }
          else
            echo "creating draft $V"
            gh release create "$V" --draft --title "$V" --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES.md $files
          fi
          echo "Draft $V ready."

  # macOS artifacts, uploaded into the draft the job above made. GitHub-hosted
  # runners: the self-hosted ones are Linux.
  macos:
    needs: release
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: haru-macos-aarch64

      - name: Set crate version
        run: |
          python3 - <<'PY'
          import os, re
          want = os.environ["V"].lstrip("v")
          text = open("Cargo.toml").read()
          text = re.sub(r'^version = "\d+\.\d+\.\d+"', f'version = "{want}"', text, count=1, flags=re.M)
          open("Cargo.toml", "w").write(text)
          PY

      - run: cargo build --release -p haru

      - name: Stage the binary and the app bundle
        run: |
          set -euo pipefail
          cp target/release/haru "haru-macos-aarch64"
          chmod +x "haru-macos-aarch64"

          app="haru.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/haru "$app/Contents/MacOS/haru"
          # A one-size icns looks soft in the Dock and wrong in the disk image,
          # so build the whole iconset from the 1024 rendering.
          set -- 16 32 128 256 512
          rm -rf haru.iconset && mkdir haru.iconset
          for size in "$@"; do
            sips -z "$size" "$size" packaging/haru-1024.png \
              --out "haru.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" packaging/haru-1024.png \
              --out "haru.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns haru.iconset -o "$app/Contents/Resources/haru.icns"
          v="${V#v}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>haru</string>
            <key>CFBundleDisplayName</key><string>haru</string>
            <key>CFBundleIdentifier</key><string>dev.unhingedsoftware.haru</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleExecutable</key><string>haru</string>
            <key>CFBundleIconFile</key><string>haru</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          ls -la "haru-macos-aarch64" "$app"

      # The way a Mac app arrives: a disk image that opens on the app beside a
      # shortcut to Applications, to drag it across. create-dmg lays that window
      # out with Finder; if it cannot (a runner without a session, say), a plain
      # image with the same two icons still works, just unstyled.
      - name: Build the disk image
        run: |
          set -euo pipefail
          brew install create-dmg

          staging=dmg-staging
          rm -rf "$staging" && mkdir -p "$staging"
          cp -R haru.app "$staging/"

          image="haru-macos-aarch64.dmg"
          rm -f "$image"
          create-dmg \
            --volname "haru" \
            --volicon "haru.app/Contents/Resources/haru.icns" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 128 \
            --icon "haru.app" 170 190 \
            --hide-extension "haru.app" \
            --app-drop-link 470 190 \
            --no-internet-enable \
            "$image" "$staging" || true

          if [ ! -f "$image" ]; then
            echo "create-dmg produced nothing; building a plain image"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname "haru" -srcfolder "$staging" -ov -format UDZO "$image"
          fi
          ls -la "$image"

      - name: Upload into the draft
        run: |
          set -euo pipefail
          files="haru-macos-aarch64 haru-macos-aarch64.dmg"
          for f in $files; do
            gh release delete-asset "$V" "$f" --yes 2>/dev/null || true
          done
          for attempt in 1 2 3; do
            if gh release upload "$V" $files --clobber; then exit 0; fi
            echo "upload attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error::could not upload the macOS assets"; exit 1
