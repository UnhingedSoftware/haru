name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Per-commit gate: format + lint. `clippy --all-targets` type-checks every
  # binary, test and example in the workspace, so this catches what a build
  # would; `cargo test` runs as the release gate instead.
  #
  # haru depends on tapline by path, so both are checked out side by side —
  # the same layout a developer has. A private tapline needs a token in
  # TAPLINE_TOKEN; without one the checkout fails loudly rather than the build
  # failing later with a confusing missing-crate error.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: haru
      - uses: actions/checkout@v4
        with:
          repository: UnhingedSoftware/tapline
          token: ${{ secrets.TAPLINE_TOKEN || github.token }}
          path: tapline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: haru

      # What eframe/wgpu need to compile on Linux: the windowing and input
      # headers. No GPU is used here — nothing is run, only built.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - run: cargo fmt --all --check
        working-directory: haru
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: haru
