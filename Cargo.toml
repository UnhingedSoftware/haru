[workspace]
resolver = "3"
members = [
    "crates/haru",
    "crates/haru-apply",
    "crates/haru-core",
    "crates/haru-media",
    "crates/haru-ui",
    "crates/haru-workshop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/UnhingedSoftware/haru"
rust-version = "1.85"

# The dependency floor, the same rule tapline holds itself to: adding a line
# here is a deliberate act, and nothing arrives by being pulled in sideways.
#
# Deliberately absent: reqwest, any -sys crate outside what wgpu itself needs.
[workspace.dependencies]
haru-apply = { path = "crates/haru-apply" }
haru-core = { path = "crates/haru-core" }
haru-media = { path = "crates/haru-media" }
haru-ui = { path = "crates/haru-ui" }
haru-workshop = { path = "crates/haru-workshop" }

tapline = { path = "../tapline/crates/tapline" }
tapline-auth = { path = "../tapline/crates/tapline-auth" }
tapline-ids = { path = "../tapline/crates/tapline-ids" }
tapline-steamworks = { path = "../tapline/crates/tapline-steamworks" }

anyhow = "1"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
sha2 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ttf-parser = { version = "0.25", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# haru is an application rather than a library in someone else's process, but
# a picker that panics loses the window and whatever was being set up in it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = true
